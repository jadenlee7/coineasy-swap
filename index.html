<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>CoinEasy x Squid 스왑</title>
  <link rel="icon" href="squid-logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="page.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <p class="notice">CoinEasy는 자금을 보관하지 않아요. 견적에는 CoinEasy 연동 수수료 0.25%가 포함돼요.</p>
  <main id="squid-root" class="widget"></main>

  <section class="card" id="wallet-help">
    <h2>지갑 연결이 안 되면</h2>
    <p>텔레그램 안에서는 <b>WalletConnect</b>를 고르면 가장 잘 돼요. 그래도 안 되면 지갑 앱에서 바로 열어 주세요. 수량은 그대로 채워져요.</p>
    <div class="wallet-links">
      <button type="button" class="pill pill-white" data-open="metamask">MetaMask로 열기</button>
      <button type="button" class="pill pill-white" data-open="trust">Trust로 열기</button>
      <button type="button" class="pill pill-white" data-open="coinbase">Coinbase로 열기</button>
      <button type="button" class="pill pill-ghost" data-open="browser">브라우저로 열기</button>
    </div>
  </section>

  <section class="card card-facts">
    <h2>어디에 연결되나요</h2>
    <ul class="facts">
      <li><span>스왑 화면</span><b>Squid 위젯</b></li>
      <li><span>견적과 경로</span><b>Squid API</b></li>
      <li><span>거래 조회</span><a href="https://scan.squidrouter.com" target="_blank" rel="noopener" data-external>Squid 스캔</a></li>
    </ul>
  </section>

  <script src="page.js"></script>
  <script src="prefill.js"></script>
  <script>
    var startParam = "";
    if (window.Telegram && window.Telegram.WebApp) {
      var webApp = window.Telegram.WebApp;
      webApp.ready();
      webApp.expand();
      if (webApp.initDataUnsafe && webApp.initDataUnsafe.start_param) {
        startParam = webApp.initDataUnsafe.start_param;
      }
    }

    const config = {
            integratorId: "coineasy-f33b68ba-dba8-4571-8c26-5f09e1876f9f",
      theme: {
        borderRadius: {
          "button-lg-primary": "3.75rem",
          "button-lg-secondary": "3.75rem",
          "button-lg-tertiary": "3.75rem",
          "button-md-primary": "1.25rem",
          "button-md-secondary": "1.25rem",
          "button-md-tertiary": "1.25rem",
          "button-sm-primary": "1.25rem",
          "button-sm-secondary": "1.25rem",
          "button-sm-tertiary": "1.25rem",
          container: "1.875rem",
          input: "9999px",
          "menu-sm": "0.9375rem",
          "menu-lg": "1.25rem",
          modal: "1.875rem"
        },
        fontSize: {
          caption: "0.875rem",
          "body-small": "1.14375rem",
          "body-medium": "1.40625rem",
          "body-large": "1.75625rem",
          "heading-small": "2.1875rem",
          "heading-medium": "3.08125rem",
          "heading-large": "4.40625rem"
        },
        fontWeight: {
          caption: "400",
          "body-small": "400",
          "body-medium": "400",
          "body-large": "400",
          "heading-small": "400",
          "heading-medium": "400",
          "heading-large": "400"
        },
        fontFamily: { "squid-main": "GeistVariable, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" },
        boxShadow: {
          container: "0px 0px 0px 1px rgba(255,255,255,0.06), 0px 10px 40px -10px rgba(188,142,228,0.25)"
        },
        // Squid brand: black, neon yellow #E6FA36, lavender #BC8EE4.
        color: {
          "grey-100": "#FBFBFD",
          "grey-200": "#EDEDED",
          "grey-300": "#D4D4D4",
          "grey-400": "#ACACAC",
          "grey-500": "#8F8F8F",
          "grey-600": "#6B6B6B",
          "grey-700": "#3C3C3C",
          "grey-800": "#1E1E1E",
          "grey-900": "#0E0E0E",
          "royal-300": "#DCC4F3",
          "royal-400": "#BC8EE4",
          "royal-500": "#A877D6",
          "royal-600": "#8F5CC4",
          "royal-700": "#6F43A0",
          "status-positive": "#55E56F",
          "status-negative": "#FF5B5B",
          "status-partial": "#F3AF25",
          "highlight-700": "#E6FA36",
          "animation-bg": "#BC8EE4",
          "animation-text": "#000000",
          "button-lg-primary-bg": "#E6FA36",
          "button-lg-primary-text": "#000000",
          "button-lg-secondary-bg": "#FBFBFD",
          "button-lg-secondary-text": "#000000",
          "button-lg-tertiary-bg": "#1E1E1E",
          "button-lg-tertiary-text": "#D4D4D4",
          "button-md-primary-bg": "#E6FA36",
          "button-md-primary-text": "#000000",
          "button-md-secondary-bg": "#FBFBFD",
          "button-md-secondary-text": "#000000",
          "button-md-tertiary-bg": "#1E1E1E",
          "button-md-tertiary-text": "#D4D4D4",
          "button-sm-primary-bg": "#E6FA36",
          "button-sm-primary-text": "#000000",
          "button-sm-secondary-bg": "#FBFBFD",
          "button-sm-secondary-text": "#000000",
          "button-sm-tertiary-bg": "#1E1E1E",
          "button-sm-tertiary-text": "#D4D4D4",
          "input-bg": "#0E0E0E",
          "input-placeholder": "#6B6B6B",
          "input-text": "#EDEDED",
          "input-selection": "#BC8EE4",
          "menu-bg": "#0E0E0EE6",
          "menu-text": "#FBFBFDA8",
          "menu-backdrop": "#FBFBFD1A",
          "modal-backdrop": "#000000B3"
        }
      },
      themeType: "dark",
      tabs: { swap: true, buy: false, send: false },
      priceImpactWarnings: { warning: 3, critical: 5 },
      loadPreviousStateFromLocalStorage: true
    };

    const prefill = window.CoinEasySquidPrefill.resolve(window.location.search, startParam);
    if (prefill) {
      config.initialAssets = { from: prefill.from, to: prefill.to };
      config.loadPreviousStateFromLocalStorage = false;
    }

    // The widget mounts in this page (no iframe), so Squid's wallet code can
    // see window.Telegram and open wallet apps the Telegram way.
    window.__coineasyBoot = {
      config: config,
      amount: prefill && prefill.amount ? prefill.amount : "",
      startParam: startParam
    };
  </script>
  <script src="squid-mount.js"></script>
</body>
</html>

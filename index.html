<!DOCTYPE html>
  <html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CoinEasy Swap</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #17191C; }
    iframe { width: 100%; height: 100%; border: none; display: block; }
  </style>
    </head>
    <body>
      <iframe id="squid-widget" allowfullscreen></iframe>
      <script src="prefill.js"></script>
      <script>
        var startParam = "";
        if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
      if (window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.start_param) {
        startParam = window.Telegram.WebApp.initDataUnsafe.start_param;
      }
  }

    const config = {
            integratorId: "coineasy-f33b68ba-dba8-4571-8c26-5f09e1876f9f",
                    theme: {
        borderRadius: {
          "button-lg-primary": "3.75rem",
                      "button-lg-secondary": "3.75rem",
                      "button-lg-tertiary": "3.75rem",
                      "button-md-primary": "1.25rem",
                      "button-md-secondary": "1.25rem",
                      "button-md-tertiary": "1.25rem",
                      "button-sm-primary": "1.25rem",
                      "button-sm-secondary": "1.25rem",
                      "button-sm-tertiary": "1.25rem",
                      container: "1.875rem",
                      input: "9999px",
                      "menu-sm": "0.9375rem",
                      "menu-lg": "1.25rem",
                      modal: "1.875rem"
            },
                    fontSize: {
          caption: "0.875rem",
                      "body-small": "1.14375rem",
                      "body-medium": "1.40625rem",
                      "body-large": "1.75625rem",
                      "heading-small": "2.1875rem",
                      "heading-medium": "3.08125rem",
                      "heading-large": "4.40625rem"
            },
                    fontWeight: {
          caption: "400",
                      "body-small": "400",
                      "body-medium": "400",
                      "body-large": "400",
                      "heading-small": "400",
                      "heading-medium": "400",
                      "heading-large": "400"
            },
        fontFamily: { "squid-main": "GeistVariable, sans-serif" },
                  boxShadow: {
          container: "0px 2px 4px 0px rgba(0,0,0,0.20), 0px 5px 50px -1px rgba(0,0,0,0.33)"
            },
                    color: {
          "grey-100": "#FBFBFD",
                      "grey-200": "#EDEFF3",
                      "grey-300": "#D1D6E0",
                      "grey-400": "#A7ABBE",
                      "grey-500": "#8A8FA8",
                      "grey-600": "#676B7E",
                      "grey-700": "#4C515D",
                      "grey-800": "#292C32",
                      "grey-900": "#17191C",
                      "royal-300": "#D9BEF4",
                      "royal-400": "#B893EC",
                      "royal-500": "#9E79D2",
                      "royal-600": "#8353C5",
                      "royal-700": "#6B45A1",
                      "status-positive": "#7AE870",
                      "status-negative": "#FF4D5B",
                      "status-partial": "#F3AF25",
                      "highlight-700": "#E4FE53",
                      "animation-bg": "#9E79D2",
                      "animation-text": "#FBFBFD",
                      "button-lg-primary-bg": "#9E79D2",
                      "button-lg-primary-text": "#FBFBFD",
                      "button-lg-secondary-bg": "#FBFBFD",
                      "button-lg-secondary-text": "#292C32",
                      "button-lg-tertiary-bg": "#292C32",
                      "button-lg-tertiary-text": "#D1D6E0",
                      "button-md-primary-bg": "#9E79D2",
                      "button-md-primary-text": "#FBFBFD",
                      "button-md-secondary-bg": "#FBFBFD",
                      "button-md-secondary-text": "#292C32",
                      "button-md-tertiary-bg": "#292C32",
                      "button-md-tertiary-text": "#D1D6E0",
                      "button-sm-primary-bg": "#9E79D2",
                      "button-sm-primary-text": "#FBFBFD",
                      "button-sm-secondary-bg": "#FBFBFD",
                      "button-sm-secondary-text": "#292C32",
                      "button-sm-tertiary-bg": "#292C32",
                      "button-sm-tertiary-text": "#D1D6E0",
                      "input-bg": "#17191C",
                      "input-placeholder": "#676B7E",
                      "input-text": "#D1D6E0",
                      "input-selection": "#D1D6E0",
                      "menu-bg": "#17191CA8",
                      "menu-text": "#FBFBFDA8",
                      "menu-backdrop": "#FBFBFD1A",
                      "modal-backdrop": "#17191C54"
            }
            },
      themeType: "dark",
              tabs: { swap: true, buy: true, send: false },
              priceImpactWarnings: { warning: 3, critical: 5 },
                      loadPreviousStateFromLocalStorage: true
                };

    const prefill = window.CoinEasySquidPrefill.resolve(window.location.search, startParam);
    if (prefill) {
      config.initialAssets = { from: prefill.from, to: prefill.to };
      config.loadPreviousStateFromLocalStorage = false;
    }

    // Same-origin frame only. The integrator id stays in this config object and
    // is not copied into the frame URL.
    window.sessionStorage.setItem("coineasy-squid-boot", JSON.stringify({
      config: config,
      amount: prefill && prefill.amount ? prefill.amount : ""
    }));
    document.getElementById("squid-widget").src = "widget.html";
  </script>
    </body>
    </html>
